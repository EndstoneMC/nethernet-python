[project]
name = "nethernet-python"
version = "0.1.0"
description = "A Python implementation of the NetherNet transport."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
keywords = ["nethernet", "minecraft", "bedrock", "webrtc", "aiortc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Networking",
]
dependencies = [
    "aiohttp>=3.9",
    "aiortc>=1.9",
    "cryptography>=42",
    "ifaddr>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3",
    "ruff==0.15.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nethernet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = "-n auto"
markers = ["conformance: byte-exact fixtures, see README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "N", "UP", "W"]
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["D"]
"tests/**" = ["D"]
"tests/session_doubles.py" = ["N802"]
